name: Verify Config

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - name: Install deps
        run: pip install -q -r requirements.txt
      - name: Verify
        run: |
          python - <<'PY'
          import yaml, main
          uc = yaml.safe_load(open('user_config.yml', encoding='utf-8'))
          sc = yaml.safe_load(open('config/seat_config.yml', encoding='utf-8'))
          bc = yaml.safe_load(open('config/basic_config.yml', encoding='utf-8'))
          b = bc['SeatAutoBooker']
          print('release-time    =', b.get('release-time'))
          print('max-retry       =', b['max-retry'])
          print('BOOK_DAYS_AHEAD =', main.BOOK_DAYS_AHEAD)
          for d in main.WEEKDAYS:
              c = uc[d]
              slots = main.get_time_slots(c)
              seats = main.get_seats_with_config(uc, c, sc)
              print('%s | 启用 %-5s | 时段 %-28s | 座位数 %3d | 前3 %s | 末尾 %s'
                    % (d, c['启用'], str([main.slot_label(s, h) for s, h in slots]),
                       len(seats), seats[:3], seats[-1]))
          print('今天(按运行日)该约:', main.target_weekday_name())
          print('OK')
          PY
